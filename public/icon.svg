<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="royalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#royalBg)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.6" />
  
  <!-- Stylized Barber Scissors / Crown Motif -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Crown Points -->
    <path d="M-80,-60 L-50,-10 L-20,-70 L0,-10 L20,-70 L50,-10 L80,-60 L60,30 L-60,30 Z" fill="url(#goldGrad)" />
    
    <!-- Crossed Barber Blades -->
    <path d="M-50,60 L50,-40" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M50,60 L-50,-40" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <circle cx="-50" cy="60" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
    <circle cx="50" cy="60" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
    <circle cx="0" cy="10" r="6" fill="#fef08a" />
  </g>
  
  <!-- Royal Label Motif -->
  <text x="256" y="410" font-family="'Vazirmatn', sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">ROYAL</text>
  <text x="256" y="445" font-family="'Vazirmatn', sans-serif" font-size="18" font-weight="500" fill="#a8a29e" text-anchor="middle" letter-spacing="2">آرایشگاه رویال</text>
</svg>
